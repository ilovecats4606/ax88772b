name: Build AX88772B

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            git \
            wget

      - name: Install Android Clang 12
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/android-clang"

          find "$HOME/android-clang" -maxdepth 3 -type f -name clang -print

      - name: Select Clang
        run: |
          CLANG=$(find "$HOME/android-clang" -type f -path '*/bin/clang' | head -1)

          if [ -z "$CLANG" ]; then
            echo "ERROR: Could not find clang"
            exit 1
          fi

          echo "Using clang: $CLANG"
          echo "CLANG_BIN=$(dirname "$CLANG")" >> "$GITHUB_ENV"
          echo "$(dirname "$CLANG")" >> "$GITHUB_PATH"

      - name: Clone Android 5.10 kernel
        run: |
          git clone --depth=1 \
            --branch android12-5.10 \
            https://android.googlesource.com/kernel/common \
            kernel

      - name: Prepare kernel
        run: |
          cd kernel

          export PATH="$CLANG_BIN:$PATH"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            defconfig

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Build AX88772B
        run: |
          export PATH="$CLANG_BIN:$PATH"

          make \
            -C kernel \
            M="$GITHUB_WORKSPACE" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules \
            V=1

      - name: Inspect module
        run: |
          echo "=== FILE ==="
          file asix.ko

          echo
          echo "=== MODINFO ==="
          modinfo asix.ko || true

          echo
          echo "=== MODINFO STRINGS ==="
          strings asix.ko | grep -E \
            'vermagic=|depends=|alias=|srcversion=' || true

          echo
          echo "=== USB ALIASES ==="
          strings asix.ko | grep -Ei \
            '0b95|772b|ax88772|asix' || true

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: ax88772b
          path: asix.ko
